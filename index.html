<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const { AXES, SCALE, SOURCES } = window.AFINIDADE_DATA;

/* Edições feitas no editor.html ficam neste navegador e substituem as afirmações do data.js */
const EDITS_KEY = "afinidade2026:edits-v3"; // muda a cada nova versão do data.js para não misturar edições antigas
function loadEdits() {
  try {
    const raw = localStorage.getItem(EDITS_KEY);
    if (!raw) return null;
    const list = JSON.parse(raw);
    const ok = Array.isArray(list) && list.length > 0 && list.every((q) =>
      Number.isInteger(q.id) && AXES.some((a) => a.id === q.axis) && (q.tier === "core" || q.tier === "extra") &&
      (q.direction === 1 || q.direction === -1) && (q.weight === 1 || q.weight === 1.5) && typeof q.text === "string" && q.text.trim());
    return ok ? list : null;
  } catch (e) { return null; }
}
const EDITED = loadEdits();
const QUESTIONS = EDITED || window.AFINIDADE_DATA.QUESTIONS;
const refsOf = (q) => (Array.isArray(q.refs) ? q.refs : q.ref ? [q.ref] : []).filter((n) => SOURCES[n]);

/* ───────────────────────── Utilidades ───────────────────────── */

function Ico({ n, size = 18, className = "", strokeWidth = 2 }) {
  const C = window.LucideReact && window.LucideReact[n];
  if (!C) return <span className={"inline-block " + className} style={{ width: size, height: size }} aria-hidden="true" />;
  return <C size={size} strokeWidth={strokeWidth} className={className} aria-hidden="true" />;
}

const STORE_KEY = "afinidade2026:v1";
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    const ids = new Set(QUESTIONS.map((q) => q.id));
    if (!s || !Array.isArray(s.order) || !s.order.every((id) => ids.has(id))) return null;
    return s;
  } catch (e) { return null; }
}
function persist(state) {
  try {
    if (state) localStorage.setItem(STORE_KEY, JSON.stringify(state));
    else localStorage.removeItem(STORE_KEY);
  } catch (e) { /* armazenamento indisponível: segue sem salvar */ }
}

const prefersReducedMotion = () => {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function questionSet(version) {
  return QUESTIONS.filter((q) => version === "long" || q.tier === "core");
}

const VERSIONS = {
  short: { key: "short", label: "Versão curta", count: questionSet("short").length },
  long: { key: "long", label: "Versão aprofundada", count: questionSet("long").length },
};
Object.values(VERSIONS).forEach((v) => { v.minutes = Math.max(1, Math.round(v.count / 7)); });

/*
 * Embaralhamento estratificado: blocos de 5 afirmações com exatamente uma de cada eixo,
 * alternando a direção (Polo Lula / Polo Flávio) ao longo de toda a sequência
 * e evitando o mesmo eixo duas vezes seguidas na virada de bloco.
 */
function buildOrder(version) {
  const set = questionSet(version);
  const pools = {};
  AXES.forEach((a) => {
    pools[a.id] = {
      "1": shuffle(set.filter((q) => q.axis === a.id && q.direction === 1)),
      "-1": shuffle(set.filter((q) => q.axis === a.id && q.direction === -1)),
    };
  });
  const left = (a) => pools[a]["1"].length + pools[a]["-1"].length;
  const seq = [];
  let want = Math.random() < 0.5 ? 1 : -1;
  let last = null;
  while (AXES.some((a) => left(a.id))) {
    let remaining = shuffle(AXES.map((a) => a.id).filter((a) => left(a)));
    while (remaining.length) {
      const notLast = remaining.filter((a) => a !== last);
      const pickFrom = notLast.length ? notLast : remaining;
      let dir = want;
      let cands = pickFrom.filter((a) => pools[a][String(dir)].length);
      if (!cands.length) { dir = -want; cands = pickFrom.filter((a) => pools[a][String(dir)].length); }
      const max = Math.max(...cands.map((a) => pools[a][String(dir)].length));
      const best = cands.filter((a) => pools[a][String(dir)].length === max);
      const ax = best[Math.floor(Math.random() * best.length)];
      const q = pools[ax][String(dir)].pop();
      seq.push(q.id);
      remaining = remaining.filter((a) => a !== ax);
      last = ax;
      want = -q.direction;
    }
  }
  return seq;
}

/*
 * Afinidade_Lula_Eixo = 50 + 50 × ( Σ(resposta × peso × direção) / (2 × Σ peso) )
 * Afinidade_Flávio_Eixo = 100 − Afinidade_Lula_Eixo
 * Resultado global = média simples dos 5 eixos
 */
function computeResults(version, answers) {
  const set = questionSet(version);
  const axes = AXES.map((a) => {
    const qs = set.filter((q) => q.axis === a.id);
    let num = 0, den = 0;
    qs.forEach((q) => {
      const v = typeof answers[q.id] === "number" ? answers[q.id] : 0;
      num += v * q.weight * q.direction;
      den += q.weight;
    });
    const lula = den ? 50 + 50 * (num / (2 * den)) : 50;
    return { ...a, lula, flavio: 100 - lula, questions: qs };
  });
  const lula = axes.reduce((s, a) => s + a.lula, 0) / axes.length;
  return { axes, lula, flavio: 100 - lula };
}

const pct = (x) => Math.round(x);
const split = (lula) => { const l = pct(lula); return [l, 100 - l]; };
const fmtWeight = (w) => (w === 1 ? "1×" : "1,5×");

function lean(lula) {
  const d = lula - 50;
  const m = Math.abs(d);
  if (m < 10) return { side: 0, label: "Equilíbrio" };
  const label = m < 25 ? "Inclinação moderada" : m < 40 ? "Inclinação forte" : "Inclinação muito forte";
  return { side: d > 0 ? 1 : -1, label };
}

function scaleOf(value) { return SCALE.find((s) => s.value === value) || SCALE[2]; }

function inIframe() { try { return window.self !== window.top; } catch (e) { return true; } }

/* ───────────────────────── Componentes base ───────────────────────── */

/* Marca: o nome fica centralizado aqui para trocar com facilidade */
const BRAND = {
  name: "isentão",
  tagline: "Lula, Flávio ou isentão? Suas ideias respondem.",
  sub: "Teste do 2º turno 2026",
  hashtag: "#isentão",
};

/* O "?" da marca: gancho desenhado + pingo dividido entre os dois polos */
const QMARK_HOOK = "M8 17C8 9.5 13.5 5 20.5 5S32.5 9.5 32.5 16c0 5.5-3.5 8.2-7.3 10.6-3 1.9-4.7 3.6-4.7 7.4v3";
function QMark({ height = 24, swing = false, className = "", title }) {
  const rel = typeof height === "string"; // ex.: "0.98em" acompanha o tamanho do texto em volta
  return (
    <svg viewBox="0 0 41 56" height={rel ? undefined : height} width={rel ? undefined : (height * 41) / 56} className={className} role={title ? "img" : undefined} aria-label={title} aria-hidden={title ? undefined : "true"}
      style={{ overflow: "visible", ...(rel ? { height, width: `calc(${height} * 0.732)` } : {}) }}>
      <path d={QMARK_HOOK} className="qmark-hook" />
      <g className={swing ? "swing" : undefined}>
        {swing && <line x1="20.5" y1="37" x2="20.5" y2="42.8" stroke="currentColor" strokeWidth="1.4" strokeDasharray="1.2 1.4" opacity=".5" />}
        <path d="M20.5 42.8a5.2 5.2 0 0 0 0 10.4z" fill="var(--lula)" />
        <path d="M20.5 42.8a5.2 5.2 0 0 1 0 10.4z" fill="var(--flavio)" />
      </g>
    </svg>
  );
}

function Wordmark({ size = 22 }) {
  const rel = typeof size === "string";
  return (
    <span className="wordmark" style={{ fontSize: size }}>
      {BRAND.name}
      <QMark height={rel ? "0.98em" : size * 0.98} className="ml-[0.06em] translate-y-[0.04em]" />
    </span>
  );
}

function Brand({ onClick }) {
  return (
    <button type="button" onClick={onClick} className="flex items-center rounded-lg" aria-label={`${BRAND.name}? Voltar ao início`}>
      <Wordmark size={24} />
    </button>
  );
}

/* Prévia da abertura: mostra como o resultado aparece (valores de exemplo) */

function SplitBar({ lula, height = 36, showText = true, animate = true, label }) {
  const [w, setW] = useState(animate && !prefersReducedMotion() ? 50 : lula);
  useEffect(() => {
    if (!animate || prefersReducedMotion()) { setW(lula); return; }
    const t = requestAnimationFrame(() => requestAnimationFrame(() => setW(lula)));
    return () => cancelAnimationFrame(t);
  }, [lula, animate]);
  const [l, f] = split(lula);
  return (
    <div className="bar" style={{ height }} role="img" aria-label={label || `Lula ${l}%, Flávio Bolsonaro ${f}%`}>
      <div className="bar-l h-full" style={{ width: w + "%" }} />
      <div className="bar-mid" />
      {showText && (
        <>
          <span className="bar-txt left-3">{l}%</span>
          <span className="bar-txt right-3">{f}%</span>
        </>
      )}
    </div>
  );
}

function Quiz({ version, order, answers, index, onAnswer, onBack, onExit }) {
  const total = order.length;
  const q = useMemo(() => QUESTIONS.find((x) => x.id === order[index]), [order, index]);
  const axis = AXES.find((a) => a.id === q.axis);
  const [phase, setPhase] = useState("in");
  const [picked, setPicked] = useState(null);
  const busy = useRef(false);

  useEffect(() => { setPhase("in"); setPicked(null); busy.current = false; }, [index]);

  const choose = useCallback((value) => {
    if (busy.current) return;
    busy.current = true;
    setPicked(value);
    const delay = prefersReducedMotion() ? 0 : 230;
    setTimeout(() => setPhase("out"), prefersReducedMotion() ? 0 : 90);
    setTimeout(() => onAnswer(q.id, value), delay);
  }, [q.id, onAnswer]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const s = SCALE.find((x) => x.key === e.key);
      if (s) { e.preventDefault(); choose(s.value); return; }
      if (e.key === "Backspace" || e.key === "ArrowLeft") { e.preventDefault(); if (!busy.current) onBack(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [choose, onBack]);

  const current = picked !== null ? picked : answers[q.id];
  const progress = (index / total) * 100;

  return (
    <>
      <header className="sticky-top" style={{ background: "var(--bg)" }}>
        <div className="h-1.5 w-full" style={{ background: "var(--surface-2)" }}>
          <div className="progress-fill h-full" style={{ width: progress + "%", background: "var(--ink)" }} />
        </div>
        <div className="gutter">
          <div className="mx-auto flex h-14 max-w-3xl items-center justify-between gap-3">
            <button type="button" className="btn btn-ghost -ml-3 px-3 text-sm" onClick={onBack}>
              <Ico n="ArrowLeft" size={18} /> {index === 0 ? "Formatos" : "Voltar"}
            </button>
            <span className="text-sm text-muted" aria-live="polite">
              Pergunta <span className="mono font-semibold text-ink">{index + 1}</span> de <span className="mono">{total}</span>
            </span>
            <button type="button" className="btn btn-ghost -mr-3 px-3 text-sm" onClick={onExit} aria-label="Sair e salvar progresso">
              <span className="hidden sm:inline">Sair</span> <Ico n="X" size={18} />
            </button>
          </div>
        </div>
      </header>

      <main className="gutter">
        <div className="mx-auto flex max-w-3xl flex-col gap-8 pb-12 pt-6 md:pt-12">
          <div key={q.id} className={phase === "out" ? "q-out" : "q-in"}>
            <div className="flex items-center gap-2 text-sm text-muted">
              <Ico n={axis.icon} size={16} />
              <span className="font-semibold">{axis.name}</span>
            </div>
            <h1 className="display mt-4 text-[1.75rem] font-bold leading-[1.18] sm:text-[2.15rem]" style={{ fontStretch: "92%" }}>
              {q.text}
            </h1>
          </div>

          <div className="flex flex-col gap-2.5" role="group" aria-label="Sua resposta">
            {SCALE.map((s) => (
              <button
                key={s.value}
                type="button"
                className={"ans tone-" + s.tone}
                aria-pressed={current === s.value}
                onClick={() => choose(s.value)}
              >
                <span className="key" aria-hidden="true">{s.key}</span>
                <span className="flex-1">{s.label}</span>
                {current === s.value && <Ico n="Check" size={20} />}
              </button>
            ))}
          </div>

          <p className="hidden items-center gap-2 text-sm text-muted md:flex">
            <Ico n="Keyboard" size={16} /> Teclas <span className="mono">1</span>–<span className="mono">5</span> respondem · <span className="mono">←</span> volta
          </p>
        </div>
      </main>
    </>
  );
}

function buildSummaryText(results, version) {
  const blocks = (lula) => {
    const n = Math.round(lula / 10);
    return "🟥".repeat(n) + "🟦".repeat(10 - n);
  };
  const [gl, gf] = split(results.lula);
  const lines = [
    `${BRAND.name}? · ${BRAND.sub.toLowerCase()}`,
    cardCopy(results).theme === "meio" ? "Isentão confirmado." : "Isentão nada.",
    `${VERSIONS[version].label} (${VERSIONS[version].count} afirmações)`,
    "",
    `Afinidade geral: Lula (PT) ${gl}% × ${gf}% Flávio Bolsonaro (PL)`,
    blocks(results.lula),
    "",
  ];
  results.axes.forEach((a) => {
    const [l, f] = split(a.lula);
    lines.push(`${a.name}: ${l}% ${a.lulaPole} × ${f}% ${a.flavioPole}`);
    lines.push(blocks(a.lula));
  });
  lines.push("", "Comparação com os planos de governo registrados no TSE em 2026.", `${BRAND.tagline} ${BRAND.hashtag}`);
  return lines.join("\n");
}

/* ───────────── Arte de compartilhamento (pôster temático) ───────────── */

const CARD_FORMATS = {
  story: { key: "story", label: "Stories", ratio: "9:16", W: 1080, H: 1920 },
  feed: { key: "feed", label: "Feed", ratio: "4:5", W: 1080, H: 1350 },
};

/* Paletas chapadas, no espírito das peças de campanha: cor sólida, tipografia condensada, geometria limpa */
const CARD_THEMES = {
  lula: { bg: "#D7261E", ink: "#FFFFFF", accent: "#FFD23F", big: "#FFFFFF", name: "#FFFFFF" },
  flavio: { bg: "#0B4EA2", ink: "#FFFFFF", accent: "#FFD400", green: "#00A651", big: "#FFD400", name: "#FFFFFF" },
  meio: { bg: "#1A73E8", bg2: "#D93025", ink: "#FFFFFF", accent: "#FFFFFF", big: "#FFFFFF", name: "#FFFFFF" },
};
const SITE_URL = "isentao.vercel.app";

function cardCopy(results) {
  const [l, f] = split(results.lula);
  const tag = (p) => (p >= 80 ? "Combinação muito forte" : p >= 65 ? "Combinação forte" : "Combinação");
  if (l >= 55) return { theme: "lula", kicker: "ISENTÃO NADA", lead: "MINHAS IDEIAS COMBINAM", big: `${l}%`, name: "COM LULA", line: `${tag(l)} com o plano de governo do PT` };
  if (f >= 55) return { theme: "flavio", kicker: "ISENTÃO NADA", lead: "MINHAS IDEIAS COMBINAM", big: `${f}%`, name: "COM FLÁVIO", line: `${tag(f)} com o plano de governo do PL` };
  return { theme: "meio", kicker: "ISENTÃO CONFIRMADO", lead: "MINHAS IDEIAS ESTÃO", big: "NO MEIO", name: "", line: `Lula ${l}% · ${f}% Flávio` };
}

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, h / 2, w / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function starPath(ctx, cx, cy, R, r, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? r : R;
    const a = rot + (i * Math.PI) / 5;
    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}

async function renderShareCard(results, version, formatKey = "story") {
  const fmt = CARD_FORMATS[formatKey] || CARD_FORMATS.story;
  const { W, H } = fmt;
  const story = fmt.key === "story";
  const copy = cardCopy(results);
  const T = CARD_THEMES[copy.theme];
  const [gl, gf] = split(results.lula);

  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  try {
    await Promise.all([
      '900 300px "Archivo"', '800 40px "Archivo"', '800 40px "Bricolage Grotesque"',
      '700 26px "Source Sans 3"', '600 30px "Source Sans 3"', '600 22px "IBM Plex Mono"',
    ].map((f) => document.fonts.load(f)));
  } catch (e) { /* segue com as fontes de reserva */ }

  const POSTER = '"Archivo", "Arial Narrow", Arial, sans-serif';
  const BRANDF = '"Bricolage Grotesque", Arial, sans-serif';
  const BODY = '"Source Sans 3", "Segoe UI", Arial, sans-serif';
  const MONO = '"IBM Plex Mono", Consolas, monospace';
  const font = (weight, size, family, stretch = "normal", spacing = "0px") => {
    x.font = `${weight} ${size}px ${family}`;
    if ("fontStretch" in x) x.fontStretch = stretch;
    if ("letterSpacing" in x) x.letterSpacing = spacing;
  };
  const fit = (text, maxW, maxSize, weight, family, stretch, spacing) => {
    let s = maxSize;
    font(weight, s, family, stretch, spacing);
    while (s > 20 && x.measureText(text).width > maxW) { s -= 4; font(weight, s, family, stretch, spacing); }
    return s;
  };

  const P = 88;
  const L = story
    ? { brand: 168, tag: 420, leadGap: 92, lead: 64, bigMax: 430, nameMax: 250, gap: 18, line: 40, panelTop: 1300, panelH: 430, footer: H - 116 }
    : { brand: 112, tag: 236, leadGap: 74, lead: 50, bigMax: 290, nameMax: 170, gap: 12, line: 32, panelTop: 820, panelH: 360, footer: H - 62 };

  /* 1. Fundo chapado com geometria simples */
  x.fillStyle = T.bg; x.fillRect(0, 0, W, H);
  if (copy.theme === "lula") {
    // estrela gigante em contorno, saindo pela direita: só parte dela aparece
    const sc = story ? { cx: W * 0.86, cy: H * 0.33, R: W * 0.52 } : { cx: W * 0.88, cy: H * 0.36, R: W * 0.44 };
    const rot = -Math.PI / 2 + 0.16;
    starPath(x, sc.cx, sc.cy, sc.R, sc.R * 0.4, rot);
    x.fillStyle = "rgba(110,0,6,.22)"; x.fill();
    x.lineWidth = story ? 10 : 8; x.lineJoin = "miter"; x.miterLimit = 10; x.strokeStyle = "rgba(255,255,255,.38)"; x.stroke();
    starPath(x, sc.cx, sc.cy, sc.R * 0.84, sc.R * 0.84 * 0.4, rot);
    x.lineWidth = 2.5; x.strokeStyle = "rgba(255,255,255,.18)"; x.stroke();
  } else if (copy.theme === "flavio") {
    x.fillStyle = T.green;
    x.beginPath(); x.moveTo(0, 0); x.lineTo(W * 0.2, 0); x.lineTo(0, H * 0.24); x.closePath(); x.fill();
    x.fillStyle = T.accent;
    x.beginPath(); x.moveTo(W * 0.66, 0); x.lineTo(W, 0); x.lineTo(W, H * (story ? 0.22 : 0.28)); x.closePath(); x.fill();
  } else if (copy.theme === "meio") {
    x.fillStyle = T.bg2;
    x.beginPath(); x.moveTo(0, 0); x.lineTo(W * 0.74, 0); x.lineTo(W * 0.26, H); x.lineTo(0, H); x.closePath(); x.fill();
  }

  /* 2. Marca no topo */
  x.textBaseline = "alphabetic"; x.textAlign = "left";
  const drawWordmark = (px, py, size, color) => {
    font(800, size, BRANDF, "semi-condensed", "-1.5px");
    x.fillStyle = color; x.fillText(BRAND.name, px, py);
    const w = x.measureText(BRAND.name).width;
    const qh = size * 0.98, s = qh / 56;
    x.save();
    x.translate(px + w + size * 0.06, py - qh + qh * 0.04); x.scale(s, s);
    x.strokeStyle = color; x.lineWidth = 7; x.lineCap = "round"; x.lineJoin = "round";
    x.stroke(new Path2D(QMARK_HOOK));
    x.beginPath(); x.arc(20.5, 48, 7.2, 0, Math.PI * 2); x.fillStyle = color; x.fill();
    x.fillStyle = "#D93025"; x.fill(new Path2D("M20.5 42.8a5.2 5.2 0 0 0 0 10.4z"));
    x.fillStyle = "#1A73E8"; x.fill(new Path2D("M20.5 42.8a5.2 5.2 0 0 1 0 10.4z"));
    x.restore();
    return w + size * 0.8;
  };
  drawWordmark(P, L.brand, story ? 50 : 42, T.ink);
  font(700, story ? 22 : 19, BODY, "normal", "4px");
  x.fillStyle = T.ink; x.globalAlpha = 0.85;
  x.fillText("TESTE DO 2º TURNO · 2026", P, L.brand + (story ? 44 : 38));
  x.globalAlpha = 1;

  /* 3. Bloco de texto em pôster */
  const maxW = W - P * 2;
  let y = L.tag + (copy.name ? 0 : Math.round(L.nameMax * 0.75)); // sem a linha do nome, o bloco desce para equilibrar
  // rubrica
  let tx = P;
  if (copy.theme === "lula") {
    starPath(x, P + 14, y - 12, 15, 6.2); x.fillStyle = T.accent; x.fill();
    tx += 40;
  }
  font(800, story ? 34 : 28, POSTER, "condensed", "3px");
  x.fillStyle = T.accent; x.fillText(copy.kicker, tx, y);

  y += L.leadGap;
  const leadSize = fit(copy.lead, maxW, L.lead, 900, POSTER, "extra-condensed", "0px");
  x.fillStyle = T.ink; x.fillText(copy.lead, P, y);

  const bigSize = fit(copy.big, maxW, L.bigMax, 900, POSTER, "extra-condensed", "-4px");
  y += L.gap + bigSize * 0.76;
  x.fillStyle = T.big; x.fillText(copy.big, P - bigSize * 0.03, y);

  if (copy.name) {
    const nameSize = fit(copy.name, maxW, L.nameMax, 900, POSTER, "extra-condensed", "-2px");
    y += L.gap + nameSize * 0.78;
    x.fillStyle = T.name; x.fillText(copy.name, P - nameSize * 0.02, y);
  }

  y += story ? 78 : 58;
  font(600, L.line, BODY);
  x.fillStyle = T.ink; x.globalAlpha = 0.92; x.fillText(copy.line, P, y, maxW); x.globalAlpha = 1;

  /* 4. Painel branco com o placar e os 5 eixos */
  const px = P - 24, pw = W - (P - 24) * 2, top = L.panelTop;
  x.fillStyle = "#FFFFFF"; roundRect(x, px, top, pw, L.panelH, 10); x.fill();
  const ix = px + 36, iw = pw - 72;
  const bar = (bx, by, bw, bh, lula, withText) => {
    x.save();
    roundRect(x, bx, by, bw, bh, 4); x.clip();
    x.fillStyle = "#1A73E8"; x.fillRect(bx, by, bw, bh);
    x.fillStyle = "#D93025"; x.fillRect(bx, by, (bw * lula) / 100, bh);
    x.fillStyle = "rgba(255,255,255,.9)"; x.fillRect(bx + bw / 2 - 1, by, 2, bh);
    x.restore();
    if (withText) {
      const [l, f] = split(lula);
      font(600, story ? 19 : 17, MONO); x.fillStyle = "#FFFFFF"; x.textBaseline = "middle";
      x.textAlign = "left"; x.fillText(l + "%", bx + 10, by + bh / 2 + 1);
      x.textAlign = "right"; x.fillText(f + "%", bx + bw - 10, by + bh / 2 + 1);
      x.textAlign = "left"; x.textBaseline = "alphabetic";
    }
  };
  let py = top + (story ? 60 : 50);
  font(800, story ? 30 : 26, POSTER, "condensed", "1px");
  x.fillStyle = "#B3261E"; x.fillText(`LULA ${gl}%`, ix, py);
  x.fillStyle = "#1559B8"; x.textAlign = "right"; x.fillText(`${gf}% FLÁVIO`, ix + iw, py); x.textAlign = "left";
  bar(ix, py + 14, iw, story ? 14 : 12, results.lula, false);
  py += story ? 88 : 72;
  const rowH = story ? 60 : 48, labelW = iw * 0.5;
  results.axes.forEach((a, i) => {
    if (i > 0) { x.fillStyle = "#ECEAF2"; x.fillRect(ix, py - rowH + (story ? 22 : 18), iw, 1); }
    font(700, story ? 24 : 20, BODY);
    x.fillStyle = "#16141D"; x.fillText(a.name, ix, py, labelW - 14);
    bar(ix + labelW, py - (story ? 24 : 20), iw - labelW, story ? 30 : 26, a.lula, true);
    py += rowH;
  });

  /* 5. Rodapé: marca e endereço do site */
  font(700, story ? 30 : 25, BODY, "normal", "0.5px");
  x.fillStyle = T.ink; x.textAlign = "left";
  x.fillText("Faça o teste:", P, L.footer);
  const lw = x.measureText("Faça o teste: ").width;
  font(800, story ? 30 : 25, BODY, "normal", "0.5px");
  x.fillText(SITE_URL, P + lw, L.footer);

  const url = c.toDataURL("image/png");
  const blob = await new Promise((res) => c.toBlob(res, "image/png"));
  return { url, blob, W, H };
}

function ShareModal({ results, version, onClose, initialFormat = "story" }) {
  const [format, setFormat] = useState(initialFormat);
  const [img, setImg] = useState(null);
  const [status, setStatus] = useState("");
  const closeRef = useRef(null);
  const framed = inIframe();
  const fileName = `afinidade-2026-${format}.png`;
  const canShareFile = (() => {
    try { return !framed && !!(img && navigator.canShare && navigator.canShare({ files: [new File([img.blob], fileName, { type: "image/png" })] })); }
    catch (e) { return false; }
  })();

  useEffect(() => {
    let alive = true;
    setImg(null); setStatus("");
    renderShareCard(results, version, format).then((r) => { if (alive) setImg(r); });
    return () => { alive = false; };
  }, [results, version, format]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    closeRef.current && closeRef.current.focus();
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  const copyImage = async () => {
    try {
      if (!img || !img.blob || !window.ClipboardItem) throw new Error("sem suporte");
      await navigator.clipboard.write([new ClipboardItem({ "image/png": img.blob })]);
      setStatus("Imagem copiada. Cole no WhatsApp, Instagram ou onde quiser.");
    } catch (e) {
      setStatus("Este navegador não permite copiar a imagem. Toque e segure (ou clique com o botão direito) sobre ela para salvar.");
    }
  };
  const download = () => {
    if (!img) return;
    const a = document.createElement("a");
    a.href = img.url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setStatus("Download iniciado.");
  };
  const share = async () => {
    try {
      await navigator.share({ files: [new File([img.blob], fileName, { type: "image/png" })], title: `Meu resultado no ${BRAND.name}?` });
    } catch (e) { /* o usuário cancelou ou o navegador recusou */ }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <div className="fade-in absolute inset-0" style={{ background: "rgba(10,12,15,.6)" }} onClick={onClose} />
      <div
        className="card fade-in relative flex max-h-[94vh] w-full max-w-xl flex-col gap-4 overflow-y-auto p-5"
        style={{
          paddingBottom: "max(20px, env(safe-area-inset-bottom, 0px))",
          paddingLeft: "max(20px, env(safe-area-inset-left, 0px))",
          paddingRight: "max(20px, env(safe-area-inset-right, 0px))",
        }}
      >
        <div className="flex items-center justify-between gap-3">
          <h2 id="share-title" className="display text-2xl font-semibold">Sua arte</h2>
          <div className="flex items-center gap-2">
            <div className="inline-flex rounded-full border hairline p-1" role="radiogroup" aria-label="Formato da arte">
              {Object.values(CARD_FORMATS).map((f) => (
                <button
                  key={f.key}
                  type="button"
                  role="radio"
                  aria-checked={format === f.key}
                  onClick={() => setFormat(f.key)}
                  className="rounded-full px-3 py-1 text-sm font-semibold transition-colors"
                  style={format === f.key ? { background: "var(--ink)", color: "var(--bg)" } : { color: "var(--muted)" }}
                >
                  {f.label} <span className="mono text-xs opacity-70">{f.ratio}</span>
                </button>
              ))}
            </div>
            <button ref={closeRef} type="button" className="btn btn-ghost px-2.5" onClick={onClose} aria-label="Fechar">
              <Ico n="X" size={20} />
            </button>
          </div>
        </div>
        <div className="grid place-items-center rounded-xl" style={{ background: "var(--surface-2)", minHeight: "40vh" }}>
          {img
            ? <img src={img.url} alt="Arte com seu resultado de afinidade" className="block rounded-lg" style={{ maxHeight: "62vh", width: "auto", maxWidth: "100%" }} />
            : <div className="text-sm text-muted">Criando sua arte…</div>}
        </div>
        <div className="flex flex-wrap gap-2">
          {canShareFile && (
            <button type="button" className="btn btn-ink" onClick={share} disabled={!img}>
              <Ico n="Share2" size={18} /> Compartilhar
            </button>
          )}
          <button type="button" className={canShareFile ? "btn btn-line" : "btn btn-ink"} onClick={copyImage} disabled={!img}>
            <Ico n="Copy" size={18} /> Copiar imagem
          </button>
          {!framed && (
            <button type="button" className="btn btn-line" onClick={download} disabled={!img}>
              <Ico n="Download" size={18} /> Baixar PNG
            </button>
          )}
        </div>
        <p className="text-sm text-muted" aria-live="polite">
          {status || (format === "story"
            ? "1080 × 1920, no tamanho certo para Stories e Status do WhatsApp."
            : "1080 × 1350, no tamanho certo para o feed do Instagram e do Facebook.")}
        </p>
      </div>
    </div>
  );
}

/* ───────────── Raio-X visual ───────────── */

const answerOf = (answers, q) => (typeof answers[q.id] === "number" ? answers[q.id] : 0);
const effectOf = (answers, q) => answerOf(answers, q) * q.direction; // >0 puxa para Lula, <0 para Flávio

function LeanTag({ effect }) {
  if (effect > 0) return <span className="chip chip-lula"><span className="dot" style={{ background: "var(--lula)" }} />{effect >= 2 ? "Bem perto de Lula" : "Mais perto de Lula"}</span>;
  if (effect < 0) return <span className="chip chip-flavio"><span className="dot" style={{ background: "var(--flavio)" }} />{effect <= -2 ? "Bem perto de Flávio" : "Mais perto de Flávio"}</span>;
  return <span className="chip"><span className="dot" style={{ background: "var(--muted)" }} />Em cima do muro</span>;
}

/* Régua de 5 pontos com a resposta marcada */
function AnswerScale({ value }) {
  const s = scaleOf(value);
  return (
    <div className="flex items-center gap-2" role="img" aria-label={`Sua resposta: ${s.label}`}>
      <span className="text-[0.68rem] font-bold uppercase tracking-wider text-muted">Concordo</span>
      <span className="relative flex items-center gap-2">
        <span className="absolute left-1 right-1 top-1/2 h-px -translate-y-1/2" style={{ background: "var(--line)" }} aria-hidden="true" />
        {SCALE.map((x) => (
          x.value === value
            ? <span key={x.value} className={"relative grid h-6 w-6 place-items-center rounded-full tone-" + x.tone} style={{ boxShadow: "0 0 0 3px var(--surface)" }}><Ico n="Check" size={13} /></span>
            : <span key={x.value} className="relative h-2.5 w-2.5 rounded-full" style={{ background: "var(--line)", boxShadow: "0 0 0 3px var(--surface)" }} />
        ))}
      </span>
      <span className="text-[0.68rem] font-bold uppercase tracking-wider text-muted">Discordo</span>
    </div>
  );
}

/* Mapa de quadradinhos: uma resposta por quadrado, na cor do lado para onde puxou */
function DotMap({ qs, answers, size = 12 }) {
  return (
    <span className="flex flex-wrap gap-1" aria-hidden="true">
      {qs.map((q) => {
        const e = effectOf(answers, q);
        const bg = e > 0 ? "var(--lula)" : e < 0 ? "var(--flavio)" : "var(--line)";
        return <span key={q.id} title={q.text} className="rounded-[3px]" style={{ width: size, height: size, background: bg, opacity: Math.abs(e) === 1 ? 0.45 : 1 }} />;
      })}
    </span>
  );
}

function StatementCard({ q, value }) {
  const [open, setOpen] = useState(false);
  const effect = value * q.direction;
  const refs = refsOf(q);
  const tint = effect > 0 ? "var(--lula-soft)" : effect < 0 ? "var(--flavio-soft)" : "var(--surface-2)";
  return (
    <li className="flex min-w-0 flex-col gap-3 rounded-2xl p-4" style={{ background: Math.abs(effect) === 2 ? tint : "var(--surface)", border: "1px solid var(--line)" }}>
      <div className="flex items-start justify-between gap-3">
        <p className="min-w-0 font-semibold leading-snug">{q.text}</p>
      </div>
      <div className="flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
        <AnswerScale value={value} />
        <LeanTag effect={effect} />
      </div>
      <button type="button" className="inline-flex items-center gap-1 self-start text-sm font-semibold text-muted hover:text-ink" aria-expanded={open} onClick={() => setOpen(!open)}>
        De onde vem <Ico n="ChevronDown" size={15} className={"transition-transform " + (open ? "rotate-180" : "")} />
      </button>
      {open && (
        <div className="fade-in flex flex-col gap-2 border-t hairline pt-3 text-[0.92rem] text-muted">
          <p>{q.basis}</p>
          {q.measures && <p><span className="font-semibold text-ink">O que isso diz sobre você:</span> {q.measures}</p>}
          {refs.length > 0 && (
            <p className="flex flex-wrap gap-1.5">
              {refs.map((n) => (
                <a key={n} href={SOURCES[n].url} target="_blank" rel="noopener noreferrer" title={SOURCES[n].title} className="chip hover:underline">
                  Fonte {n}<Ico n="ExternalLink" size={12} />
                </a>
              ))}
            </p>
          )}
        </div>
      )}
    </li>
  );
}

function AxisAccordion({ a, answers, open, onToggle }) {
  const [l, f] = split(a.lula);
  const panelId = "raiox-" + a.id;
  const qs = a.questions.slice().sort((x, y) => effectOf(answers, y) - effectOf(answers, x)); // Lula primeiro, Flávio por último
  const nL = qs.filter((q) => effectOf(answers, q) > 0).length;
  const nF = qs.filter((q) => effectOf(answers, q) < 0).length;
  const nN = qs.length - nL - nF;
  const [showPlans, setShowPlans] = useState(false);
  return (
    <div className="border-t hairline first:border-t-0">
      <h3>
        <button type="button" aria-expanded={open} aria-controls={panelId} onClick={onToggle} className="flex w-full items-center gap-3 py-4 text-left">
          <span className="grid h-10 w-10 flex-none place-items-center rounded-xl" style={{ background: "var(--brand-soft)", color: "var(--brand)" }}>
            <Ico n={a.icon} size={19} />

          <span className="flex min-w-0 flex-1 flex-col gap-1.5">

          <Ico n="ChevronDown" size={20} className={"flex-none transition-transform " + (open ? "rotate-180" : "")} />
        </button>
      </h3>
      {open && (
        <div id={panelId} className="fade-in flex flex-col gap-5 pb-6">
          <div className="flex flex-wrap items-center gap-2">
            <span className="chip chip-lula">{nL} pro lado de Lula</span>
            <span className="chip">{nN} em cima do muro</span>
            <span className="chip chip-flavio">{nF} pro lado de Flávio</span>
          </div>
          <ul className="grid gap-3 md:grid-cols-2">
            {qs.map((q) => <StatementCard key={q.id} q={q} value={answerOf(answers, q)} />)}

          <div>
            <button type="button" className="btn btn-line text-sm" aria-expanded={showPlans} onClick={() => setShowPlans(!showPlans)}>
              <Ico n="BookOpen" size={16} /> {showPlans ? "Esconder" : "Ver"} o que cada plano propõe neste tema
            </button>
            {showPlans && (
              <div className="fade-in mt-4 flex flex-col gap-3">
                <p className="max-w-[70ch] text-[0.95rem] text-muted">{a.summary}</p>
                <div className="grid gap-3 md:grid-cols-2">
                  {[["lula", "Lula (PT)", a.lulaPoleFull], ["flavio", "Flávio Bolsonaro (PL)", a.flavioPoleFull]].map(([k, who, pole]) => (
                    <div key={k} className="flex flex-col gap-3 rounded-2xl p-4" style={{ background: `var(--${k}-soft)` }}>
                      <div>
                        <div className="font-bold" style={{ color: `var(--${k}-ink)` }}>{who}</div>
                        <div className="text-sm" style={{ color: `var(--${k}-ink)` }}>{pole}</div>
                      </div>
                      <ul className="flex flex-col gap-2.5">
                        {a.dimensions.map((d) => (
                          <li key={d.label} className="text-sm">
                            <span className="font-semibold text-ink">{d.label}.</span> <span className="text-muted">{d[k]}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────── Seus destaques ───────────── */

function Highlights({ results, answers }) {
  const all = results.axes.flatMap((a) => a.questions.map((q) => ({ q, a, v: answerOf(answers, q), e: effectOf(answers, q) })));
  const top = (side) => all
    .filter((x) => x.e * side > 0)
    .sort((x, y) => Math.abs(y.e) - Math.abs(x.e) || y.q.weight - x.q.weight)
    .slice(0, 3);
  const L = top(1), F = top(-1);
  const nL = all.filter((x) => x.e > 0).length;
  const nF = all.filter((x) => x.e < 0).length;
  const nN = all.length - nL - nF;
  const pct = (n) => (n / all.length) * 100;
  const Column = ({ items, k, who }) => (
    <div className="flex min-w-0 flex-col gap-3 rounded-2xl p-4 sm:p-5" style={{ background: `var(--${k}-soft)` }}>
      <h3 className="display text-xl font-semibold" style={{ color: `var(--${k}-ink)` }}>Onde você fica com {who}</h3>
      {items.length === 0
        ? <p className="text-[0.95rem] text-muted">Nenhuma resposta sua puxou para esse lado.</p>
        : (
          <ol className="flex flex-col gap-3">
            {items.map(({ q, a, v }) => (
              <li key={q.id} className="flex gap-3 rounded-xl p-3" style={{ background: "var(--surface)" }}>
                <span className="grid h-8 w-8 flex-none place-items-center rounded-lg" style={{ background: `var(--${k}-soft)`, color: `var(--${k}-ink)` }}>
                  <Ico n={a.icon} size={16} />
                </span>
                <span className="flex min-w-0 flex-col gap-1">
                  <span className="text-[0.95rem] font-semibold leading-snug">{q.text}</span>
                  <span className="text-sm text-muted">Você: {scaleOf(v).label.toLowerCase()}</span>
                </span>
              </li>
            ))}
          </ol>
        )}
    </div>
  );
  return (
    <section className="card p-5 sm:p-8" aria-labelledby="destaques-title">
      <h2 id="destaques-title" className="display text-3xl font-semibold">Seus destaques</h2>
      <p className="mt-2 text-[0.95rem] text-muted">As respostas que mais levaram você para cada lado.</p>

      <div className="mt-5">
        <div className="flex h-9 overflow-hidden rounded-full" role="img" aria-label={`${nL} respostas pro lado de Lula, ${nN} em cima do muro, ${nF} pro lado de Flávio`}>
          {nL > 0 && <div className="flex items-center justify-start px-3 text-sm font-bold text-white" style={{ width: pct(nL) + "%", background: "var(--lula)" }}>{nL}</div>}
          {nN > 0 && <div className="flex items-center justify-center px-2 text-sm font-bold" style={{ width: pct(nN) + "%", background: "var(--surface-2)", color: "var(--muted)" }}>{nN}</div>}
          {nF > 0 && <div className="flex items-center justify-end px-3 text-sm font-bold text-white" style={{ width: pct(nF) + "%", background: "var(--flavio)" }}>{nF}</div>}
        </div>
        <div className="mt-2 flex flex-wrap justify-between gap-2 text-sm">
          <span style={{ color: "var(--lula-ink)" }}>Pro lado de Lula</span>
          <span className="text-muted">Em cima do muro</span>
          <span style={{ color: "var(--flavio-ink)" }}>Pro lado de Flávio</span>
        </div>
      </div>

      <div className="mt-6 grid gap-4 md:grid-cols-2">
        <Column items={L} k="lula" who="Lula" />
        <Column items={F} k="flavio" who="Flávio" />
      </div>

      <p className="mt-5 flex items-center gap-2 text-[0.95rem] text-muted">
        <Ico n="Fence" size={18} />
        {nN === 0
          ? "Nenhuma resposta em cima do muro. Isentão passou longe."
          : nN >= all.length / 2
            ? `Em cima do muro em ${nN} de ${all.length} afirmações. Isentão de carteirinha.`
            : `Em cima do muro em ${nN} de ${all.length} afirmações.`}
      </p>
    </section>
  );
}

function Results({ version, answers, onRestart, onHome }) {
  const results = useMemo(() => computeResults(version, answers), [version, answers]);
  const [gl, gf] = split(results.lula);
  const [openAxis, setOpenAxis] = useState(null);
  const [shareOpen, setShareOpen] = useState(false); // false | "story" | "feed"
  const closeShare = useCallback(() => setShareOpen(false), []);
  const [copyState, setCopyState] = useState("idle");
  const [fallbackText, setFallbackText] = useState("");
  const fallbackRef = useRef(null);
  const summary = useMemo(() => buildSummaryText(results, version), [results, version]);

  useEffect(() => { if (fallbackText && fallbackRef.current) fallbackRef.current.select(); }, [fallbackText]);

  const copySummary = () => {
    const done = () => { setCopyState("done"); setTimeout(() => setCopyState("idle"), 2200); };
    try {
      navigator.clipboard.writeText(summary).then(done, () => setFallbackText(summary));
    } catch (e) { setFallbackText(summary); }
  };

  const diff = results.lula - 50;
  const verdict = cardCopy(results).theme === "meio" ? "Isentão confirmado." : "Isentão nada.";
  const headline = Math.abs(diff) < 3
    ? "Suas respostas ficaram praticamente empatadas entre os dois planos."
    : `Suas respostas estão mais próximas do plano de ${diff > 0 ? "Lula (PT)" : "Flávio Bolsonaro (PL)"}.`;

  const toLula = results.axes.filter((a) => a.lula >= 55);
  const toFlavio = results.axes.filter((a) => a.lula <= 45);
  const crossPressured = toLula.length > 0 && toFlavio.length > 0;
  const list = (arr) => arr.map((a) => a.name).join(", ").replace(/, ([^,]*)$/, " e $1");

  return (
    <>
      <TopBar onHome={onHome}>
        <button type="button" className="btn btn-ghost px-3 text-sm" onClick={onRestart}>
          <Ico n="RotateCcw" size={16} /> <span className="hidden sm:inline">Refazer teste</span>
        </button>
      </TopBar>
      <main className="gutter">
        <div className="mx-auto flex max-w-4xl flex-col gap-8 py-8 md:py-12">
          {/* Placar geral */}
          <section className="card p-5 sm:p-8" aria-labelledby="placar-title">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <span className="eyebrow" id="placar-title">O veredito</span>
              <span className="chip">{VERSIONS[version].label} · <span className="mono">{VERSIONS[version].count}</span> afirmações</span>
            </div>
            <p className="display mt-3 text-5xl font-semibold leading-none sm:text-6xl">
              {verdict}
            </p>
            <div className="mt-6 grid grid-cols-2 items-end gap-4">
              <div className="min-w-0">
                <div className="text-[0.95rem] font-semibold sm:text-lg" style={{ color: "var(--lula-ink)" }}>Lula <span className="font-normal">(PT)</span></div>
                <div className="display text-[3.6rem] font-bold leading-none sm:text-8xl" style={{ color: "var(--lula)" }}>
                  {gl}<span className="text-[0.5em]">%</span>
                </div>
              </div>
              <div className="min-w-0 text-right">
                <div className="text-[0.95rem] font-semibold sm:text-lg" style={{ color: "var(--flavio-ink)" }}>Flávio Bolsonaro <span className="font-normal">(PL)</span></div>
                <div className="display text-[3.6rem] font-bold leading-none sm:text-8xl" style={{ color: "var(--flavio)" }}>
                  {gf}<span className="text-[0.5em]">%</span>
                </div>
              </div>
            </div>
            <div className="mt-5"><SplitBar lula={results.lula} height={16} showText={false} /></div>
            <p className="mt-5 text-lg font-semibold">{headline}</p>
            <p className="mt-1 text-[0.95rem] text-muted">Média simples dos cinco eixos abaixo. O resultado mede proximidade com as propostas escritas nos planos, não é uma recomendação de voto.</p>
            <div className="mt-6 flex flex-wrap gap-2 border-t hairline pt-5">
              <button type="button" className="btn btn-ink" onClick={() => setShareOpen("story")}>
                <Ico n="Image" size={18} /> Criar minha arte
              </button>
              <button type="button" className="btn btn-line" onClick={copySummary}>
                <Ico n={copyState === "done" ? "Check" : "Copy"} size={18} /> {copyState === "done" ? "Resumo copiado" : "Copiar resumo"}
              </button>
              <button type="button" className="btn btn-line" onClick={onRestart}>
                <Ico n="RotateCcw" size={18} /> Refazer teste
              </button>
            </div>
            {fallbackText && (
              <div className="mt-4 flex flex-col gap-2">
                <label htmlFor="resumo-texto" className="text-sm text-muted">Não foi possível copiar automaticamente. O texto está selecionado: use Ctrl+C (ou Copiar no celular).</label>
                <textarea id="resumo-texto" ref={fallbackRef} readOnly value={fallbackText} rows={8} className="mono w-full rounded-xl border hairline p-3 text-sm" style={{ background: "var(--surface-2)", color: "var(--ink)" }} />
              </div>
            )}
          </section>

          <ShareTeaser results={results} version={version} onOpen={(f) => setShareOpen(f)} />

          {/* 5 eixos */}
          <section className="card p-5 sm:p-8" aria-labelledby="eixos-res-title">
            <div className="flex flex-wrap items-baseline justify-between gap-2">
              <h2 id="eixos-res-title" className="display text-3xl font-semibold">Os 5 eixos</h2>
              <div className="flex items-center gap-4 text-sm">
                <span className="flex items-center gap-1.5"><span className="dot" style={{ background: "var(--lula)" }} />Polo Lula</span>
                <span className="flex items-center gap-1.5"><span className="dot" style={{ background: "var(--flavio)" }} />Polo Flávio</span>
              </div>
            </div>
            <div className="mt-6 flex flex-col">
              {results.axes.map((a) => <AxisRow key={a.id} a={a} />)}
            </div>
          </section>

          <Highlights results={results} answers={answers} />

          {crossPressured && (
            <section className="flex gap-4 rounded-2xl border hairline p-5 sm:p-6" style={{ background: "var(--surface-2)" }}>
              <Ico n="Split" size={22} className="mt-0.5 flex-none text-muted" />
              <div className="flex flex-col gap-1">
                <h2 className="font-bold">Perfil de pressões cruzadas</h2>
                <p className="text-[0.95rem] text-muted">
                  Você ficou mais perto de Lula em <strong className="text-ink">{list(toLula)}</strong> e mais perto de Flávio Bolsonaro em{" "}
                  <strong className="text-ink">{list(toFlavio)}</strong>. Eleitores com esse perfil costumam decidir o voto pelo tema que pesa mais para eles.
                </p>
              </div>
            </section>
          )}

          {/* Raio-X */}
          <section className="card p-5 sm:p-8" aria-labelledby="raiox-title">
            <h2 id="raiox-title" className="display text-3xl font-semibold">Raio-X das propostas</h2>
            <p className="mt-2 max-w-[65ch] text-[0.95rem] text-muted">
              Cada quadradinho é uma resposta sua, na cor do lado para onde ela puxou. Abra um tema para ver afirmação por afirmação.
            </p>
            <div className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1.5 text-sm text-muted">
              <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded-[3px]" style={{ background: "var(--lula)" }} />Bem perto de Lula</span>
              <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded-[3px]" style={{ background: "var(--lula)", opacity: 0.45 }} />Mais perto de Lula</span>
              <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded-[3px]" style={{ background: "var(--line)" }} />Em cima do muro</span>
              <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded-[3px]" style={{ background: "var(--flavio)", opacity: 0.45 }} />Mais perto de Flávio</span>
              <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded-[3px]" style={{ background: "var(--flavio)" }} />Bem perto de Flávio</span>
            </div>
            <div className="mt-4">
              {results.axes.map((a) => (
                <AxisAccordion
                  key={a.id}
                  a={a}
                  answers={answers}
                  open={openAxis === a.id}
                  onToggle={() => setOpenAxis(openAxis === a.id ? null : a.id)}
                />
              ))}
            </div>
          </section>
          <Footer compact />
        </div>
      </main>
      {shareOpen && <ShareModal results={results} version={version} initialFormat={shareOpen} onClose={closeShare} />}
    </>
  );
}

/* ───────────────────────── Rodapé ───────────────────────── */

function Footer({ compact }) {
  const [open, setOpen] = useState(false);
  return (
    <footer className={(compact ? "" : "mx-auto max-w-6xl ") + "border-t hairline py-8 text-sm text-muted"}>
      <p className="max-w-[75ch]">
        O {BRAND.name}? é uma ferramenta educativa e sem vínculo com partidos ou campanhas. As afirmações resumem propostas dos planos de governo
        registrados no TSE, conforme o documento-base "Arquitetura de Dados Eleitorais e Mapeamento de Polarização no Segundo
        Turno Presidencial de 2026" e as reportagens citadas. Suas respostas ficam só neste navegador.
      </p>
      <button type="button" className="mt-3 inline-flex items-center gap-1.5 font-semibold text-ink" aria-expanded={open} onClick={() => setOpen(!open)}>
        <Ico n="BookOpen" size={16} /> Fontes ({Object.keys(SOURCES).length})
        <Ico n="ChevronDown" size={16} className={"transition-transform " + (open ? "rotate-180" : "")} />
      </button>
      {open && (
        <ol className="fade-in mt-3 grid gap-1.5 md:grid-cols-2">
          {Object.entries(SOURCES).map(([n, s]) => (
            <li key={n} className="flex min-w-0 gap-2">
              <span className="mono flex-none">{n}.</span>
              <a href={s.url} target="_blank" rel="noopener noreferrer" className="min-w-0 break-words underline decoration-[var(--line)] underline-offset-2 hover:text-ink">{s.title}</a>
            </li>
          ))}
        </ol>
      )}
    </footer>
  );
}

/* ───────────────────────── App ───────────────────────── */

function App() {
  const [saved, setSaved] = useState(() => loadSaved());
  const [state, setState] = useState({ screen: "home", version: "short", order: [], answers: {}, index: 0 });

  useEffect(() => { window.scrollTo(0, 0); }, [state.screen]);

  const save = (s) => { persist(s); setSaved(s); };

  const start = (version) => {
    const s = { screen: "quiz", version, order: buildOrder(version), answers: {}, index: 0 };
    setState(s); save(s);
  };

  const onAnswer = useCallback((id, value) => {
    setState((prev) => {
      const answers = { ...prev.answers, [id]: value };
      const next = prev.index + 1;
      const s = next >= prev.order.length
        ? { ...prev, answers, index: prev.order.length - 1, screen: "results" }
        : { ...prev, answers, index: next };
      persist(s); setSaved(s);
      return s;
    });
  }, []);

  const onBack = useCallback(() => {
    setState((prev) => {
      if (prev.index === 0) return { ...prev, screen: "choose" };
      const s = { ...prev, index: prev.index - 1 };
      persist(s); setSaved(s);
      return s;
    });
  }, []);

  const goHome = () => { setSaved(loadSaved()); setState((p) => ({ ...p, screen: "home" })); };

  if (state.screen === "quiz") {
    return <Quiz {...state} onAnswer={onAnswer} onBack={onBack} onExit={goHome} />;
  }
  if (state.screen === "results") {
    return <Results version={state.version} answers={state.answers} onRestart={() => setState((p) => ({ ...p, screen: "choose" }))} onHome={goHome} />;
  }
  if (state.screen === "choose") {
    return <Choose onPick={start} onBack={goHome} />;
  }
  return (
    <Home
      saved={saved}
      onStart={() => setState((p) => ({ ...p, screen: "choose" }))}
      onResume={() => saved && setState({ ...saved, screen: "quiz" })}
      onViewLast={() => saved && setState({ ...saved, screen: "results" })}
      onDiscard={() => save(null)}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
